<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serverless File Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            border: 1px solid #ddd;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            margin: 15px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Serverless File Manager</h1>

        <p>Upload your files securely using AWS.</p>

        <button id="loginButton">Login with Cognito</button>

        <hr>

        <h2>Upload File</h2>

        <input type="file" id="fileInput">

        <br>

        <button id="uploadButton">Upload File</button>

        <p id="status"></p>

    </div>

    <script src="app.js"></script>

</body>
</html>
